<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maze Runner</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
</head>
<body>
  <div class="container">
    <img class="logo" src="assets/logo.png" alt="Maze Runner">
    <button id="musicBtn"><span id="musicIcon">🔊</span> <span class="btn-text">Pause Music</span></button>

    <p>Click and drag on the canvas to draw walls.</p>
    <canvas id="maze" width="350" height="350"></canvas>
    
    <p id="status"></p>
    <div class="buttons">
      <button id="trainBtn" class="button">Train</button>
      <button id="playBtn" class="button">Watch it walk</button>
      <img id="resetBtn" src="assets/reset.png" alt="Reset">
    </div>
    

    <audio id="bgMusic" src="music.mp3" loop></audio>

    <footer style="margin-top: 40px; font-size: 0.8em; color: #888;">
      Music by <a href="https://pixabay.com/users/luminkai-36540552/">Lumin Kai</a> from <a href="https://pixabay.com/music/">Pixabay</a>. 
      Made with ❤️ by Stephanie Emenike
    </footer>
  </div>

  <script>
    const canvas = document.getElementById("maze");
    const ctx = canvas.getContext("2d");

    const SIZE = 10;                       // 10 x 10 grid
    const CELL = canvas.width / SIZE;      // each square is 40px

    const start = { row: 0, col: 0 };
    const goal = { row: SIZE - 1, col: SIZE - 1 };
    let robot = { row: start.row, col: start.col };

    // walls[row][col] is true if there's a wall there
    const walls = [];
    for (let r = 0; r < SIZE; r++) {
      walls.push(new Array(SIZE).fill(false));
    }

    //Image loading
    function loadImage(src) {
      const img = new Image();
      img.src = src;
      return img;
    }

    const startImg = loadImage("assets/start.png");
    const finishImg = loadImage("assets/finish.png");
    const robotImg = loadImage("assets/runner.png");

    let imagesLoaded = 0;
    const totalImages = 3;

    [startImg, finishImg, robotImg].forEach((img) => {
      img.onload = () => {
        imagesLoaded++;
        if (imagesLoaded === totalImages) {
          draw();
        }
      };
    });

    // Drawing 
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {

          if (walls[r][c]) {
            ctx.fillStyle = "#2e56a8";
            ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
          } else if (r === start.row && c === start.col) {
            ctx.drawImage(startImg, c * CELL, r * CELL, CELL, CELL);
          } else if (r === goal.row && c === goal.col) {
            ctx.drawImage(finishImg, c * CELL, r * CELL, CELL, CELL);
          }

          ctx.strokeStyle = "#ffffff";
          ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
        }
      }

      ctx.drawImage(robotImg, robot.col * CELL, robot.row * CELL, CELL, CELL);
    }

    //Drag to draw walls 
    let isDragging = false;
    let dragMode = null; // true = adding walls, false = removing walls

    function cellFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const col = Math.floor((e.clientX - rect.left) / CELL);
      const row = Math.floor((e.clientY - rect.top) / CELL);
      return { row, col };
    }

    function paintWall(row, col) {
      const isStart = row === start.row && col === start.col;
      const isGoal = row === goal.row && col === goal.col;
      if (isStart || isGoal) return;

      walls[row][col] = dragMode;
      draw();
    }

    canvas.addEventListener("mousedown", (e) => {
      const { row, col } = cellFromEvent(e);
      isDragging = true;
      dragMode = !walls[row][col];
      paintWall(row, col);
    });

    canvas.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const { row, col } = cellFromEvent(e);
      paintWall(row, col);
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    // Background music 
    const music = document.getElementById("bgMusic");
    let musicStarted = false;

    document.body.addEventListener("click", () => {
      if (!musicStarted) {
        music.play();
        musicStarted = true;
      }
    }, { once: true });

    document.getElementById("musicBtn").addEventListener("click", () => {
      const icon = document.getElementById("musicIcon");
      const text = document.querySelector("#musicBtn .btn-text");

      if (music.paused) {
        music.play();
        icon.textContent = "🔊";
        text.textContent = "Pause Music";
      } else {
        music.pause();
        icon.textContent = "🔇";
        text.textContent = "Play Music";
      }
    });

    //  Q-learning setup 
    const ACTIONS = [
      { dr: -1, dc: 0 },  // 0 = up
      { dr: 0, dc: 1 },   // 1 = right
      { dr: 1, dc: 0 },   // 2 = down
      { dr: 0, dc: -1 }   // 3 = left
    ];

    const Q = [];
    for (let r = 0; r < SIZE; r++) {
      const row = [];
      for (let c = 0; c < SIZE; c++) {
        row.push([0, 0, 0, 0]);
      }
      Q.push(row);
    }

    const alpha = 0.5;    // learning rate
    const gamma = 0.9;    // discount
    const epsilon = 0.2;  // how often it explores

    function chooseAction(row, col) {
      if (Math.random() < epsilon) {
        return Math.floor(Math.random() * 4);
      }
      const q = Q[row][col];
      return q.indexOf(Math.max(...q));
    }

    function step(row, col, action) {
      const nr = row + ACTIONS[action].dr;
      const nc = col + ACTIONS[action].dc;

      const outside = nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE;
      if (outside || walls[nr][nc]) {
        return { row: row, col: col, reward: -5, done: false };
      }
      if (nr === goal.row && nc === goal.col) {
        return { row: nr, col: nc, reward: 100, done: true };
      }
      return { row: nr, col: nc, reward: -1, done: false };
    }

    function runEpisode() {
      let row = start.row;
      let col = start.col;
      let steps = 0;

      while (steps < 200) {
        const a = chooseAction(row, col);
        const result = step(row, col, a);

        const best = Math.max(...Q[result.row][result.col]);
        const target = result.done ? result.reward : result.reward + gamma * best;
        Q[row][col][a] += alpha * (target - Q[row][col][a]);

        row = result.row;
        col = result.col;
        steps++;
        if (result.done) break;
      }
      return steps;
    }

    function walkPath() {
      robot = { row: start.row, col: start.col };
      draw();

      let steps = 0;

      function nextStep() {
        if (robot.row === goal.row && robot.col === goal.col) return;
        if (steps >= 100) return;

        const q = Q[robot.row][robot.col];
        const a = q.indexOf(Math.max(...q));
        const result = step(robot.row, robot.col, a);

        robot = { row: result.row, col: result.col };
        steps++;
        draw();

        setTimeout(nextStep, 200);
      }

      nextStep();
    }

    //  Buttons 
    document.getElementById("trainBtn").addEventListener("click", () => {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          Q[r][c] = [0, 0, 0, 0];
        }
      }

      const first = runEpisode();
      let last = 0;
      for (let i = 0; i < 500; i++) {
        last = runEpisode();
      }

      document.getElementById("status").textContent =
        "First attempt: " + first + " steps. After 500 attempts: " + last + " steps.";
    });

    document.getElementById("playBtn").addEventListener("click", walkPath);

    document.getElementById("resetBtn").addEventListener("click", () => {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          walls[r][c] = false;
          Q[r][c] = [0, 0, 0, 0];
        }
      }

      robot = { row: start.row, col: start.col };
      document.getElementById("status").textContent = "";
      draw();
    });
  </script>

</body>
</html>
